name: Playwright Tests

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 12:00 PM IST → 06:30 AM UTC
    - cron: '30 6 * * *'
    # Every 5 minutes IST → 23:30 UTC previous day, 00:00 UTC, 00:05, etc.
    - cron: '*/15 * * * *'

concurrency:
  group: playwright-tests
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Print UTC and IST timestamps
        run: |
          echo "Current UTC time: $(date -u)"
          echo "Current IST time: $(date -u -d '+5 hours 30 minutes')"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --workers=2

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: playwright-report/screenshots/
          retention-days: 30
